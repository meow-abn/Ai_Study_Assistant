<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="supabaseClient.js"></script>
  <script src="auth.js" defer></script>

</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div class="bg-white p-6 rounded shadow w-80">
    <h2 class="text-xl font-bold mb-4">Login / Signup</h2>

    <input id="email" type="email" placeholder="Email" class="w-full p-2 border mb-2">
    <input id="password" type="password" placeholder="Password" class="w-full p-2 border mb-2">

    <button onclick="signup()" class="bg-blue-500 text-white w-full py-2 mb-2">Signup</button>
    <button onclick="login()" class="bg-green-500 text-white w-full py-2">Login</button>
  </div>
</body>
</html>
